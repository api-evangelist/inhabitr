aid: inhabitr
name: Inhabitr
description: 'Inhabitr is a Chicago-founded furnishing company that operates an AI-assisted
  furniture rental and procurement platform for commercial real estate and residential
  customers. Its business side (inhabitr.ai) furnishes hospitality, multifamily, student
  housing, short-term rental, co-living, senior living and office properties end to
  end — design, sourcing, procurement, delivery, installation and asset tracking —
  while its consumer storefront (inhabitr.com) rents furniture, sets and decor to households
  on flexible terms with a browser-based Home Designer tool. The company describes
  real-time connectivity to warehouses, manufacturers and retailers as the "furniture
  cloud" behind its bidding and fulfillment, but it publishes no public developer program,
  API documentation, or machine-readable contract of any kind as of this profiling pass.'
